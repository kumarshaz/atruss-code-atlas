name: CI Suite

on:
  push:
    branches: [ "main", "002-*", "003-*", "004/*", "004-*", "006-*", "009-*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -e .[dev]
    - run: ruff check src/ tests/ scripts/
    - run: pytest tests/unit/ -v --strict-markers

  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: web/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - working-directory: web
      run: npm ci && npm test && npm run build && ASTRO_SITE=https://kumarshaz.github.io ASTRO_BASE=/atruss-code-atlas npm run build

  integration-and-e2e:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -e .[dev]
    - run: pytest tests/integration/ -v --strict-markers

  agent-workflow-eval:
    needs: integration-and-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -e .[dev]
    - run: python scripts/validate_agent_workflow.py --spec specs/006-core-unification-and-eval --output /tmp/eval-006.json
    - run: python scripts/validate_agent_workflow.py --spec specs/009-unified-atlas-spec
