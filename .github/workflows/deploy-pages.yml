name: Deploy Material UI to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref or branch to checkout when invoked after an automated export push"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web schema and UI contract tests
        working-directory: web
        run: npm test

      - name: Sync discovery data & build Astro M3 site
        working-directory: web
        env:
          ASTRO_SITE: "https://atruss.shashinkumar.com"
          ASTRO_BASE: "/"
        run: npm run build

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
