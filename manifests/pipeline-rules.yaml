version: "1.0"
description: >
  Policy-as-Code CI/CD pipeline anti-pattern and supply-chain security rules
  manifest for Atruss Code Atlas (FR-021).

trusted_action_owners:
  - "actions"

rules:
  - rule_id: "ATRUSS-PIPE-001"
    type: "NO_TEST_GATE"
    default_severity: "CRITICAL"
    enabled: true
    description: >
      Deployment job executes without an upstream test/verification job in its
      dependency chain.
    remediation: >
      Add a 'needs:' dependency on a test or verification job before executing
      deployment steps.

  - rule_id: "ATRUSS-PIPE-002"
    type: "NO_CACHE"
    default_severity: "MEDIUM"
    enabled: true
    description: >
      Workflow installs dependencies without configuring dependency caching via
      actions/cache or setup-* cache options.
    remediation: >
      Enable built-in caching on setup-* actions (e.g., cache: 'pip' or 'npm')
      or add an explicit actions/cache step.

  - rule_id: "ATRUSS-PIPE-003"
    type: "NO_ARTIFACT_HANDOFF"
    default_severity: "MEDIUM"
    enabled: true
    description: >
      Multi-job workflow includes build and deploy stages without immutable
      artifact or container image handoff.
    remediation: >
      Publish immutable build outputs with actions/upload-artifact or push
      signed container images before deploying.

  - rule_id: "ATRUSS-PIPE-004"
    type: "HARDCODED_SECRET"
    default_severity: "CRITICAL"
    enabled: true
    description: >
      Potential hardcoded credential, token, or secret literal detected in
      workflow environment variables or shell commands.
    remediation: >
      Remove literal secret values and reference encrypted GitHub Secrets via
      ${{ secrets.SECRET_NAME }} or OIDC federation.

  - rule_id: "ATRUSS-PIPE-005"
    type: "SEQUENTIAL_ONLY"
    default_severity: "LOW"
    enabled: true
    description: >
      Workflow chains 3 or more jobs strictly sequentially with zero parallel
      execution branches.
    remediation: >
      Parallelize independent jobs such as linting, unit testing, and security
      scanning to reduce pipeline cycle time.

  - rule_id: "ATRUSS-PIPE-006"
    type: "UNFILTERED_MAIN_PUSH"
    default_severity: "HIGH"
    enabled: true
    description: >
      Deployment-capable workflow triggers on push events without branch or tag
      filters.
    remediation: >
      Restrict push triggers using explicit 'branches:' or 'tags:' allowlists
      (for example, branches: [main]).

  - rule_id: "ATRUSS-PIPE-007"
    type: "UNLABELED_SELF_HOSTED"
    default_severity: "MEDIUM"
    enabled: true
    description: >
      Job targets generic 'self-hosted' runner without constraining runner
      capability or environment labels.
    remediation: >
      Specify dedicated runner labels (for example, [self-hosted, linux, x64,
      prod]) or use ephemeral GitHub-hosted runners.

  - rule_id: "ATRUSS-PIPE-008"
    type: "UNPINNED_ACTION"
    default_severity: "HIGH"
    enabled: true
    trusted_action_owners:
      - "actions"
    description: >
      Third-party GitHub Action is referenced by a mutable branch or tag rather
      than an immutable 40-character commit SHA.
    remediation: >
      Pin third-party actions to a full 40-character commit SHA (for example,
      uses: owner/action@<40-hex-sha> # v1.2.3).

  - rule_id: "ATRUSS-PIPE-009"
    type: "TEMPLATE_INJECTION"
    default_severity: "CRITICAL"
    enabled: true
    description: >
      Shell script interpolates untrusted GitHub event context expressions or
      writes untrusted variables directly to $GITHUB_ENV or $GITHUB_PATH.
    remediation: >
      Pass untrusted GitHub context values through intermediate step 'env:'
      variables, quote shell expansions, and avoid writing untrusted data to
      $GITHUB_ENV or $GITHUB_PATH.

  - rule_id: "ATRUSS-PIPE-010"
    type: "PWN_REQUEST_RISK"
    default_severity: "CRITICAL"
    enabled: true
    description: >
      Workflow triggered by pull_request_target checks out untrusted pull
      request head code with privileged repository access.
    remediation: >
      Do not check out untrusted PR head refs under pull_request_target; use
      pull_request for untrusted code builds or isolate artifact consumption.

  - rule_id: "ATRUSS-PIPE-011"
    type: "EXCESSIVE_PERMISSIONS"
    default_severity: "HIGH"
    enabled: true
    description: >
      Workflow omits explicit GITHUB_TOKEN permissions or grants broad
      'write-all' permissions.
    remediation: >
      Declare explicit least-privilege 'permissions:' (for example, contents:
      read) at the workflow or job level.

  - rule_id: "ATRUSS-PIPE-012"
    type: "NO_TIMEOUT"
    default_severity: "LOW"
    enabled: true
    description: >
      Job omits 'timeout-minutes', allowing hung steps to consume runner minutes
      up to the 360-minute platform maximum.
    remediation: >
      Set an explicit 'timeout-minutes:' value on every job (for example,
      timeout-minutes: 15).

  - rule_id: "ATRUSS-PIPE-013"
    type: "ARTIFACT_CREDENTIAL_PERSISTENCE"
    default_severity: "MEDIUM"
    enabled: true
    description: >
      Job runs actions/checkout without 'persist-credentials: false' and uploads
      artifacts that may expose git credentials in .git/config.
    remediation: >
      Set 'with: persist-credentials: false' on actions/checkout steps in jobs
      that upload artifacts.

  - rule_id: "ATRUSS-PIPE-014"
    type: "STATIC_CLOUD_CREDENTIALS"
    default_severity: "HIGH"
    enabled: true
    description: >
      Job authenticates to AWS, Azure, or GCP without OIDC 'id-token: write'
      permissions or references static cloud credential secrets.
    remediation: >
      Configure short-lived OIDC federation with 'permissions: id-token: write'
      and replace long-lived static cloud keys.
