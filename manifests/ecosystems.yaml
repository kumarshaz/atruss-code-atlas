version: "1.0"
description: >
  Policy-as-Code classification manifest for Atruss Code Atlas.
  Defines priority-ordered ecosystem detection, framework sub-classification,
  monorepo module manifest anchors, and 27-column discovery signals.

# Priority order enforces tie-breaking: Java > .NET > Python > JS/TS
ecosystems:
  - id: java_springboot
    display_name: "Java"
    priority: 100
    manifest_patterns:
      - "(^|/)pom\\.xml$"
      - "(^|/)build\\.gradle(\\.kts)?$"
    extension_patterns:
      - "\\.java$"
      - "\\.kt$"
    path_signals:
      - "(^|/)src/main/java/"
    frameworks:
      - name: "Spring Boot"
        path_patterns:
          - "(^|/)src/main/resources/application\\.(ya?ml|properties)$"
          - "Application\\.java$"
        content_patterns:
          - "spring-boot"
          - "org\\.springframework\\.boot"
          - "@SpringBootApplication"
      - name: "Quarkus"
        path_patterns: []
        content_patterns:
          - "io\\.quarkus"
      - name: "Java Maven/Gradle"
        path_patterns:
          - "(^|/)src/main/java/"
        content_patterns: []

  - id: ".net"
    display_name: ".NET"
    priority: 90
    manifest_patterns:
      - "\\.sln$"
      - "\\.csproj$"
      - "\\.fsproj$"
      - "\\.vbproj$"
      - "(^|/)global\\.json$"
    extension_patterns:
      - "\\.cs$"
      - "\\.fs$"
      - "\\.vb$"
    path_signals: []
    frameworks:
      - name: "ASP.NET Core"
        path_patterns:
          - "(^|/)[Cc]ontrollers/"
          - "(^|/)appsettings(\\.[^/]+)?\\.json$"
          - "(^|/)Program\\.cs$"
          - "(^|/)Startup\\.cs$"
        content_patterns:
          - "Microsoft\\.NET\\.Sdk\\.Web"
          - "WebApplication\\.CreateBuilder"
      - name: ".NET Worker Service"
        path_patterns:
          - "Worker\\.cs$"
        content_patterns:
          - "BackgroundService"
          - "IHostedService"
      - name: "Blazor"
        path_patterns:
          - "\\.razor$"
        content_patterns:
          - "Microsoft\\.AspNetCore\\.Components"

  - id: python
    display_name: "Python"
    priority: 80
    manifest_patterns:
      - "(^|/)requirements\\.txt$"
      - "(^|/)requirements-[^/]+\\.txt$"
      - "(^|/)pyproject\\.toml$"
      - "(^|/)setup\\.py$"
      - "(^|/)setup\\.cfg$"
      - "(^|/)Pipfile$"
    extension_patterns:
      - "\\.py$"
    path_signals:
      - "(^|/)__init__\\.py$"
    frameworks:
      - name: "FastAPI"
        path_patterns: []
        content_patterns:
          - "\\bfastapi\\b"
          - "FastAPI\\("
      - name: "Django"
        path_patterns:
          - "(^|/)manage\\.py$"
          - "(^|/)settings\\.py$"
        content_patterns:
          - "\\bdjango\\b"
      - name: "Flask"
        path_patterns: []
        content_patterns:
          - "\\bflask\\b"
          - "Flask\\("

  - id: go
    display_name: "Go"
    priority: 75
    manifest_patterns:
      - "(^|/)go\\.mod$"
      - "(^|/)go\\.sum$"
      - "(^|/)go\\.work$"
    extension_patterns:
      - "\\.go$"
    path_signals:
      - "(^|/)cmd/"
      - "(^|/)pkg/"
    frameworks:
      - name: "Go Gin / Echo / Fiber"
        path_patterns: []
        content_patterns:
          - "github\\.com/gin-gonic/gin"
          - "github\\.com/labstack/echo"
          - "github\\.com/gofiber/fiber"
      - name: "Go Service"
        path_patterns:
          - "(^|/)main\\.go$"
          - "(^|/)cmd/.+/main\\.go$"
        content_patterns: []

  - id: rust
    display_name: "Rust"
    priority: 74
    manifest_patterns:
      - "(^|/)Cargo\\.toml$"
      - "(^|/)Cargo\\.lock$"
    extension_patterns:
      - "\\.rs$"
    path_signals:
      - "(^|/)src/main\\.rs$"
      - "(^|/)src/lib\\.rs$"
    frameworks:
      - name: "Axum / Actix / Rocket"
        path_patterns: []
        content_patterns:
          - "\\baxum\\b"
          - "\\bactix-web\\b"
          - "\\brocket\\b"
      - name: "Rust Cargo"
        path_patterns:
          - "(^|/)Cargo\\.toml$"
        content_patterns: []

  - id: ruby
    display_name: "Ruby"
    priority: 73
    manifest_patterns:
      - "(^|/)Gemfile$"
      - "(^|/)Gemfile\\.lock$"
      - "\\.gemspec$"
    extension_patterns:
      - "\\.rb$"
    path_signals:
      - "(^|/)config/routes\\.rb$"
      - "(^|/)app/controllers/"
    frameworks:
      - name: "Ruby on Rails"
        path_patterns:
          - "(^|/)config/application\\.rb$"
          - "(^|/)config/routes\\.rb$"
          - "(^|/)bin/rails$"
        content_patterns:
          - "gem ['\"]rails['\"]"
          - "Rails::Application"
      - name: "Ruby"
        path_patterns:
          - "(^|/)Gemfile$"
        content_patterns: []

  - id: php
    display_name: "PHP"
    priority: 72
    manifest_patterns:
      - "(^|/)composer\\.json$"
      - "(^|/)composer\\.lock$"
    extension_patterns:
      - "\\.php$"
    path_signals:
      - "(^|/)apps/"
      - "(^|/)app/Http/"
    frameworks:
      - name: "Laravel"
        path_patterns:
          - "(^|/)artisan$"
        content_patterns:
          - "laravel/framework"
      - name: "Symfony"
        path_patterns:
          - "(^|/)symfony\\.lock$"
        content_patterns:
          - "symfony/"
      - name: "PHP Composer"
        path_patterns:
          - "(^|/)composer\\.json$"
        content_patterns: []

  - id: elixir
    display_name: "Elixir"
    priority: 71
    manifest_patterns:
      - "(^|/)mix\\.exs$"
      - "(^|/)mix\\.lock$"
    extension_patterns:
      - "\\.exs?$"
    path_signals:
      - "(^|/)lib/.+\\.ex$"
    frameworks:
      - name: "Phoenix"
        path_patterns:
          - "(^|/)lib/.+_web/"
        content_patterns:
          - ":phoenix"
      - name: "Elixir Mix"
        path_patterns:
          - "(^|/)mix\\.exs$"
        content_patterns: []

  - id: react_ts_js
    display_name: "JavaScript/TypeScript"
    priority: 70
    manifest_patterns:
      - "(^|/)package\\.json$"
      - "(^|/)tsconfig\\.json$"
    extension_patterns:
      - "\\.tsx?$"
      - "\\.jsx?$"
    path_signals: []
    frameworks:
      - name: "Next.js"
        path_patterns:
          - "(^|/)next\\.config\\.(js|mjs|ts)$"
        content_patterns:
          - "\"next\"\\s*:"
      - name: "Angular"
        path_patterns:
          - "(^|/)angular\\.json$"
        content_patterns:
          - "@angular/core"
      - name: "Astro"
        path_patterns:
          - "(^|/)astro\\.config\\.(js|mjs|ts)$"
        content_patterns:
          - "\"astro\"\\s*:"
      - name: "React (Vite)"
        path_patterns:
          - "(^|/)vite\\.config\\.(js|mjs|ts)$"
        content_patterns:
          - "\"react\"\\s*:"
      - name: "React"
        path_patterns:
          - "\\.tsx$"
          - "\\.jsx$"
        content_patterns:
          - "\"react\"\\s*:"
      - name: "Express / Node API"
        path_patterns:
          - "(^|/)server\\.(js|ts)$"
        content_patterns:
          - "\"express\"\\s*:"
          - "\"fastify\"\\s*:"
      - name: "TypeScript"
        path_patterns:
          - "(^|/)tsconfig\\.json$"
        content_patterns: []

  - id: infra_devops
    display_name: "Container / Helm / IaC"
    priority: 10
    manifest_patterns:
      - "(^|/)Chart\\.ya?ml$"
      - "(^|/)docker-compose(\\.[^/]+)?\\.ya?ml$"
      - "(^|/)compose\\.ya?ml$"
      - "(^|/)Dockerfile(\\.[^/]+)?$"
      - "(^|/)kustomization\\.ya?ml$"
    extension_patterns:
      - "\\.tf$"
      - "\\.bicep$"
    path_signals:
      - "(^|/)(helm|charts|k8s|kubernetes|terraform)/"
    frameworks:
      - name: "Helm Chart"
        path_patterns:
          - "(^|/)Chart\\.ya?ml$"
        content_patterns: []
      - name: "Docker Compose"
        path_patterns:
          - "(^|/)docker-compose(\\.[^/]+)?\\.ya?ml$"
          - "(^|/)compose\\.ya?ml$"
        content_patterns: []
      - name: "Terraform / IaC"
        path_patterns:
          - "\\.tf$"
          - "\\.bicep$"
        content_patterns: []
      - name: "Container"
        path_patterns:
          - "(^|/)Dockerfile(\\.[^/]+)?$"
        content_patterns: []

discovery_signals:
  HasAPI:
    - "\\.API\\."
    - "(^|/)[Cc]ontrollers/"
    - "Controller\\.cs$"
    - "(^|/)routers?/"
    - "(^|/)routes/"
    - "(^|/)endpoints?/"
    - "(^|/)api/"
    - "openapi\\.ya?ml$"
    - "swagger\\.json$"
  HasService:
    - "\\.Service\\."
    - "Worker\\.cs$"
    - "BackgroundService"
    - "(^|/)services?/"
    - "(^|/)workers?/"
  HasFrontend:
    - "\\.tsx$"
    - "\\.jsx$"
    - "(^|/)angular\\.json$"
    - "(^|/)next\\.config\\."
    - "(^|/)vite\\.config\\."
    - "(^|/)astro\\.config\\."
    - "(^|/)src/components/"
    - "(^|/)pages/"
  HasDatabase:
    - "\\.sql$"
    - "\\.sqlproj$"
    - "(^|/)migrations/"
    - "(^|/)alembic"
    - "(^|/)prisma/"
    - "DbContext\\.cs$"
    - "(^|/)models\\.py$"
    - "(^|/)entities/"
  HasDockerfile:
    - "(^|/)Dockerfile(\\.[^/]+)?$"
    - "(^|/)docker-compose(\\.[^/]+)?\\.ya?ml$"
  HasPipeline:
    - "(^|/)\\.github/workflows/.*\\.ya?ml$"
  HasKubernetes:
    - "(^|/)(k8s|kubernetes|helm|charts)/"
    - "(^|/)Chart\\.ya?ml$"
    - "(^|/)kustomization\\.ya?ml$"
  HasTerraform:
    - "\\.tf$"
    - "\\.bicep$"

deployable_mappings:
  HasAPI: "API"
  HasService: "Service"
  HasFrontend: "Frontend"
  HasDatabase: "Database"

stack_mappings:
  HasDockerfile: "Docker"
  HasPipeline: "CI/CD"
  HasKubernetes: "Kubernetes"
  HasTerraform: "Terraform"

documentation_priority:
  p1_min_releases: 3
