[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atruss-code-atlas"
version = "0.1.0"
description = "Repository Discovery and Deep Analysis Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "sqlalchemy>=2.0.29",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "networkx>=3.2.1",
    "radon>=6.0.1",
    "bandit>=1.7.8",
    "psycopg2-binary>=2.9.9",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
]

[project.scripts]
repo-analyzer = "src.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
pythonpath = ["."]
